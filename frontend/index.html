<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLN Lending Suite — Login</title>
  <meta name="description" content="Secure login portal for the CLN Lending Suite." />
  <meta name="theme-color" content="#0f2747" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
  <script>
    (function () {
      try {
        var storedTheme = localStorage.getItem('cln_theme');
        var theme = storedTheme === 'light' || storedTheme === 'dark'
          ? storedTheme
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (err) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="login-page">
  <div class="login-wrapper">

    <div class="login-container">
      <div class="login-card">
        <div class="login-brand">
          <div class="brand-logo-container">
            <img class="brand-logo" src="/icons/logo.png" alt="DIXIT Lending Solution Logo" />
          </div>
          <h2 class="brand-title">Dixit Lending Solution</h2>
        </div>

        <div class="login-role-toggle" role="group" aria-label="Select login role">
          <button type="button" id="btn-admin" class="active" onclick="selectRole('admin')">Admin</button>
          <button type="button" id="btn-employee" onclick="selectRole('employee')">Employee</button>
        </div>

        <div id="login-alert" class="alert alert-error"></div>

        <form id="login-form" onsubmit="handleLogin(event)" autocomplete="off">
          <div class="form-group">
            <input type="email" id="email" class="form-control" placeholder="Email or username" required autocomplete="off" />
          </div>
          
          <div class="form-group password-group">
            <div class="password-input-wrapper">
              <input type="password" id="password" class="form-control" placeholder="Password" required autocomplete="new-password" />
              <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" aria-label="Show password" title="Show password">
                <svg id="eye-icon-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                  <circle cx="12" cy="12" r="2.5"></circle>
                </svg>
              </button>
            </div>
            <a href="/reset-password.html" class="forgot-password" id="forgot-password-link">Forgot password?</a>
          </div>

          <div class="form-group checkbox-group">
            <input type="checkbox" id="keep-signed" class="form-checkbox" />
            <label for="keep-signed" class="checkbox-label">Keep me signed in</label>
          </div>

          <button type="submit" id="login-btn" class="btn btn-primary">
            <span id="btn-text">
              <svg class="login-lock-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" style="display:inline-block; vertical-align:middle; margin-right:8px;">
                <rect x="4" y="10" width="16" height="10" rx="2"></rect>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
              </svg>
              Sign in
            </span>
            <span id="btn-spinner" class="spinner" style="display:none;"></span>
          </button>
        </form>

      </div>
    </div>

    <footer class="login-page-footer">
      <p>© 2026 Dixit Lending Solution. All Rights Reserved.</p>
      <span class="footer-link"><a href="#">~Support & Assistance: avitecin@gmail.com</a></span>
    </footer>
  </div>

  <script src="/js/runtime-config.js?v=20260615c"></script>
  <script src="/js/api.js?v=20260615b"></script>
  <script>
    let selectedRole = 'admin';
    let isSubmitting = false;

    // 1. Silent cleanup of any legacy insecure credentials
    ['password', 'userPassword', 'employeePassword', 'savedPassword', 'loginPassword', 'credentials', 'savedCredentials'].forEach(function(k) {
      try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {}
    });

    // 2. Show cached login error if any (like auto-deactivation)
    const cachedError = localStorage.getItem('login_error') || sessionStorage.getItem('login_error');
    if (cachedError) {
      const alertEl = document.getElementById('login-alert');
      if (alertEl) {
        alertEl.className = 'alert alert-error show';
        alertEl.textContent = cachedError;
      }
      localStorage.removeItem('login_error');
      sessionStorage.removeItem('login_error');
    }

    // 3. Redirect if already authenticated with active session
    const existingUser = getUser();
    const existingToken = getToken();
    if (existingUser && existingToken) {
      window.location.href = existingUser.role === 'admin' ? '/admin/dashboard.html?fresh=20260516d' : '/employee/dashboard.html';
    }

    // 4. Prefill remembered identifier if "Keep me signed in" was previously enabled
    try {
      const rememberedEmail = localStorage.getItem('cln_remembered_email');
      const rememberedRole  = localStorage.getItem('cln_remembered_role');
      const keepSignedState = localStorage.getItem('cln_keep_signed');

      if (rememberedRole === 'admin' || rememberedRole === 'employee') {
        selectRole(rememberedRole);
      }

      if (rememberedEmail) {
        const emailInput = document.getElementById('email');
        if (emailInput) emailInput.value = rememberedEmail;
      }

      const keepSignedEl = document.getElementById('keep-signed');
      if (keepSignedEl) {
        keepSignedEl.checked = keepSignedState === 'true' || Boolean(rememberedEmail);
      }
    } catch (err) {}

    // Ensure password field is ALWAYS empty on initial load
    const initialPw = document.getElementById('password');
    if (initialPw) initialPw.value = '';

    function selectRole(role) {
      selectedRole = role;
      document.getElementById('btn-admin').classList.toggle('active', role === 'admin');
      document.getElementById('btn-employee').classList.toggle('active', role === 'employee');
      // Clear password field on role switch to prevent cross-account credential leakage
      const pwInput = document.getElementById('password');
      if (pwInput) pwInput.value = '';
      const alertEl = document.getElementById('login-alert');
      if (alertEl) alertEl.classList.remove('show');
    }

    // Clear password on pageshow
    window.addEventListener('pageshow', () => {
      const pwInput = document.getElementById('password');
      if (pwInput) pwInput.value = '';
    });

    // SVG path data for the two eye states
    const EYE_PATHS = {
      eye: '<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle>',
      eyeOff: '<path d="M3 3l18 18"></path><path d="M10.5 10.5a2.5 2.5 0 1 0 3 3"></path><path d="M6.2 6.2C3.9 7.9 2 12 2 12s3.5 6 10 6c1.3 0 2.5-.2 3.6-.6"></path><path d="M14.6 4.6C13.8 4.2 12.9 4 12 4c-6.5 0-10 8-10 8a20.1 20.1 0 0 0 4.8 5.7"></path>'
    };

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.querySelector('.toggle-password');
      const isVisible = passwordInput.type === 'password';

      passwordInput.type = isVisible ? 'text' : 'password';
      toggleBtn.classList.toggle('visible', isVisible);
      toggleBtn.setAttribute('aria-label', isVisible ? 'Hide password' : 'Show password');
      toggleBtn.setAttribute('title', isVisible ? 'Hide password' : 'Show password');

      const svg = document.getElementById('eye-icon-svg');
      if (svg) {
        svg.innerHTML = isVisible ? EYE_PATHS.eyeOff : EYE_PATHS.eye;
      }
    }

    async function handleLogin(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      if (isSubmitting) return false;

      const emailInput = document.getElementById('email');
      const pwInput    = document.getElementById('password');
      const email      = emailInput ? emailInput.value.trim() : '';
      const password   = pwInput ? pwInput.value : '';
      const keepMeSignedIn = Boolean(document.getElementById('keep-signed')?.checked);
      const alertEl    = document.getElementById('login-alert');
      alertEl.classList.remove('show');

      if (!email || !password) {
        alertEl.className = 'alert alert-error show';
        alertEl.textContent = 'Please enter both email/username and password.';
        return false;
      }

      isSubmitting = true;
      const loginBtn = document.getElementById('login-btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');

      btnText.style.display = 'none';
      btnSpinner.style.display = 'inline-block';
      loginBtn.disabled = true;

      try {
        const res = await api.post('/auth/login', { email, password, role: selectedRole, keepMeSignedIn });

        // Immediately clear the password from memory and the DOM input
        if (pwInput) pwInput.value = '';

        if (!res || !res.ok) {
          const msg = res?.data?.message || 'Login failed. Please check your credentials.';
          alertEl.className = 'alert alert-error show';
          alertEl.textContent = msg;
          return false;
        }

        // Handle "Keep me signed in" identifier remembering (email & role only, NEVER password)
        if (keepMeSignedIn) {
          try {
            localStorage.setItem('cln_remembered_email', email);
            localStorage.setItem('cln_remembered_role', selectedRole);
            localStorage.setItem('cln_keep_signed', 'true');
          } catch (storageErr) {}
        } else {
          try {
            localStorage.removeItem('cln_remembered_email');
            localStorage.removeItem('cln_remembered_role');
            localStorage.removeItem('cln_keep_signed');
          } catch (storageErr) {}
        }

        setSession(res.data.token, res.data.user, keepMeSignedIn);
        if (res.data.must_change_password || res.data.user?.must_change_password) {
          window.location.href = '/employee/profile.html?force_password_change=1';
        } else {
          window.location.href = res.data.user.role === 'admin' ? '/admin/dashboard.html?fresh=20260516d' : '/employee/dashboard.html';
        }
        return true;
      } catch (err) {
        alertEl.className = 'alert alert-error show';
        alertEl.textContent = 'An unexpected error occurred. Please try again.';
        return false;
      } finally {
        isSubmitting = false;
        btnText.style.display = 'inline-flex';
        btnSpinner.style.display = 'none';
        loginBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
